services:
  awaker:
    image: ${AWAKER_IMAGE:-ghcr.io/afk-sapien/awaker-service:latest}
    env_file: .env
    environment:
      AWAKER_HOST: 0.0.0.0
      PORT: 4173
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - sunday-data:/app/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  # Retained so existing deployments keep their data.
  sunday-data:
