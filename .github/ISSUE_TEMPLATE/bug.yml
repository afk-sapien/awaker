name: Bug report
description: Report an Awaker problem with reproducible steps
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce. Remove private league data and tokens.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Awaker version, Node version or Docker image, browser, and hosting mode
    validations:
      required: true
