<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#141d21"><meta name="description" content="All your Sleeper teams. One Sunday screen. Live player tracking and league-aware fantasy decisions."><title>Sunday · Fantasy HQ</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"></head><body><div id="app"><p style="padding:30px">Loading your Sunday…</p></div><div id="toast" role="status"></div><dialog id="connect"><form id="connect-form"><div class="eyebrow">YOUR LEAGUES, TOGETHER</div><h2>Connect to Sleeper</h2><p>Enter your public username. We’ll find all your NFL leagues. No password needed.</p><label for="username">Sleeper username</label><input id="username" name="username" autocomplete="username" placeholder="Your username" required maxlength="60"><p class="muted small">Your username and league preferences stay in this browser. Moves are made in Sleeper.</p><div id="connect-error" role="alert"></div><div class="actions"><button type="button" class="secondary" id="cancel-connect">Cancel</button><button class="primary" type="submit">Find my leagues →</button></div></form></dialog><script>window.addEventListener('error',e=>{console.error(e.message);if(!document.querySelector('.sidebar'))document.getElementById('app').textContent='Sunday could not load. Refresh the page to try again.';});</script><script type="module" src="/app.js"></script></body></html>
