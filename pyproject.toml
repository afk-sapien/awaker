[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "awaker"
dynamic = ["version"]
description = "A self-hosted companion for your Sleeper fantasy football leagues"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Awaker contributors"}]
dependencies = ["nodejs-wheel-binaries>=24.19,<25"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/afk-sapien/awaker"
Issues = "https://github.com/afk-sapien/awaker/issues"

[project.scripts]
awaker = "awaker.cli:main"

[tool.hatch.version]
path = "package.json"
pattern = '"version": "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/awaker"]

[tool.hatch.build.targets.wheel.force-include]
"dist" = "awaker/_app/dist"
"server" = "awaker/_app/server"
"package.json" = "awaker/_app/package.json"

[tool.hatch.build.targets.sdist]
include = ["/src", "/dist", "/server", "/package.json", "/README.md", "/LICENSE", "/pyproject.toml", "/tests/python"]

# Hatch excludes directories named dist by default. Here dist contains source.
[tool.hatch.build.targets.sdist.force-include]
"dist" = "dist"
